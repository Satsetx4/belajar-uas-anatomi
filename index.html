    <!-- Anti-Flash Theme Boot Script -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('uas_anatomi_theme');
          if (theme !== 'light' && theme !== 'dark') {
            var raw = localStorage.getItem('uas_anatomi_state_v1');
            if (raw) {
              var parsed = JSON.parse(raw);
              if (parsed && (parsed.theme === 'light' || parsed.theme === 'dark')) {
                theme = parsed.theme;
              }
            }
          }
          var active = theme === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(active);
          root.style.colorScheme = active;
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
